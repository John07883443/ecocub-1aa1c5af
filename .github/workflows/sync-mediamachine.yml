# Статьи из Медиамашины → блог сайта (content/blog), раз в час.
#
# Новые материалы, опубликованные в Медиамашине на сайт «ЭКОКУБ» (проект
# ЭкоКуб), приходят сюда файлами и сразу уходят в main. Коммит от
# GITHUB_TOKEN сам по себе НЕ запускает другие workflow, поэтому деплой
# вызывается явно (workflow_dispatch от этого токена GitHub пропускает).
#
# Ключ выдачи — секрет MM_SITE_KEY (раздел «Интеграция с сайтом» в
# Медиамашине, ключ только на чтение этого сайта).
name: Sync MediaMachine articles

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-mediamachine
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Забрать новые статьи
        env:
          MM_KEY: ${{ secrets.MM_SITE_KEY }}
        run: node scripts/sync-mediamachine.mjs

      - name: Закоммитить и запустить деплой
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain content/blog public/images/blog)" ]; then
            echo "Новых статей нет."
            exit 0
          fi
          git config user.name "mediamachine-sync"
          git config user.email "mediamachine-sync@users.noreply.github.com"
          git add content/blog public/images/blog
          git commit -m "Блог: новые статьи из Медиамашины"
          git push origin HEAD:main
          gh workflow run deploy.yml --ref main
