# Автодеплой EcoCub на main-1 (178.130.63.130, systemd-служба ecocub).
#
# Сборка идёт здесь, а не на сервере: рядом с сайтом на main-1 живут другие
# службы, а сборке нужно около 1,5 ГБ памяти. На сервер приезжает готовый
# .output архивом через ssh; релизы, переключение и автооткат делает
# серверный scripts/main1/ecocub-deploy.
#
# Секрет один: MAIN1_DEPLOY_KEY (Settings → Secrets and variables → Actions) —
# закрытый ключ пользователя deploy-ecocub. Этим ключом можно только
# выкладывать (принудительная команда ecocub-deploy-ssh), не входить в shell.
# Ключи сайта (Telegram, Google OAuth, ECOCUB_ADMIN_SECRET) лежат на сервере в
# /etc/ecocub.env и в workflow больше не передаются.
#
# Имя «Deploy to VPS» не менять: на него завязан notify-telegram.yml.
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Версия должна совпадать с той, под которой сайт работает на сервере
      # (Node 22): собранный бандл рассчитан на конкретный рантайм.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка
        run: npm run build
        env:
          NITRO_PRESET: node-server

      # Проверка цели сборки. Сервер запускает `node .output/server/index.mjs`,
      # а конфиг Lovable по умолчанию подставляет воркер для Cloudflare —
      # такой артефакт под Node молча завершается, не открывая порт. Если
      # цель когда-нибудь съедет, деплой должен упасть здесь, а не на бою.
      - name: Проверка цели сборки
        run: |
          test -f .output/server/index.mjs || { echo "нет .output/server/index.mjs"; exit 1; }
          grep -q '"preset": "node-server"' .output/nitro.json || {
            echo "ОШИБКА: цель сборки не node-server"; cat .output/nitro.json; exit 1; }
          # Кадры ленты Медиамашины перегоняет в WebP sharp (родной модуль):
          # он должен лечь в сборку под Linux, иначе обложки новых статей не отдадутся.
          (cd .output/server && node --input-type=module -e "
            const sharp = (await import('sharp')).default;
            await sharp({ create: { width: 2, height: 2, channels: 3, background: '#fff' } }).webp().toBuffer();
            console.log('sharp в сборке работает');")

      # Собранный сервер поднимается прямо здесь и отвечает на запросы.
      # Переменных базы в CI нет намеренно: заодно проверяется, что при
      # недоступной базе сайт отдаёт карточки из файлов, а не падает.
      - name: Проверка запуска
        run: |
          LEADS_DB_PATH="$RUNNER_TEMP/leads.db" PORT=3000 HOST=127.0.0.1 \
            node .output/server/index.mjs & echo $! > /tmp/srv.pid
          for i in $(seq 1 30); do sleep 1; curl -sf -o /dev/null http://127.0.0.1:3000/ && break; done
          fail=0
          for path in / /portfolio /concrete /blog /sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "http://127.0.0.1:3000$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || fail=1
          done
          kill "$(cat /tmp/srv.pid)" 2>/dev/null || true
          [ "$fail" = "0" ] || { echo "ОШИБКА: собранный сайт отвечает не 200"; exit 1; }

      # Ключ хоста записан прямо здесь: он публичный, а сверка защищает от
      # подмены сервера. Сменили сервер — обновите строку (ssh-keyscan).
      - name: Ключи SSH
        env:
          DEPLOY_KEY: ${{ secrets.MAIN1_DEPLOY_KEY }}
        run: |
          [ -n "$DEPLOY_KEY" ] || { echo "ОШИБКА: нет секрета MAIN1_DEPLOY_KEY"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/main1
          chmod 600 ~/.ssh/main1
          echo '178.130.63.130 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC0OH8/i1fTjkgyJ6BGdkCLhQlFjndht0Fbjpt/DCEa+' > ~/.ssh/known_hosts

      # Код выхода сервера: 0 — релиз работает; 2 — новый не поднялся и сайт
      # вернулся на прежний (выкладка красная, сайт жив); 3 — нужны руки.
      - name: Выкладка на main-1
        run: |
          release="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          echo "релиз $release"
          tar -czf - -C .output . | ssh -i ~/.ssh/main1 \
            -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes \
            -o BatchMode=yes -o ConnectTimeout=20 \
            deploy-ecocub@178.130.63.130 "deploy $release"

      - name: Проверка снаружи
        run: |
          for path in / /blog /sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://eco-cub.ru$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
